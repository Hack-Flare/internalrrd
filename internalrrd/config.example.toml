# InternalRRD service configuration.
#
# The management protocol listens on TCP port 54 by default.
[management]
port = 54

[application]
# A human readable name used in logs and deployment checks.
name = "example"
# The entrypoint template inside an extracted release.
command = "{release_dir}/bin/example"
# Every argument is a template. Named placeholders select one application port.
args = [
  "--ntp-port", "{port:ntp}",
  "--dns-port", "{port:dns}",
  "--http-port", "{port:http}",
  "--https-port", "{port:https}",
]
# Optional. Defaults to the release directory when a release is active.
working_directory = "{release_dir}"
# Seconds an instance has to exit after SIGTERM before it is killed.
shutdown_timeout_secs = 30
# Instances started for each release.
instances = 2
# Seconds new instances must stay alive before traffic switches to them.
startup_grace_secs = 2
# Directory where release artifacts are extracted.
release_directory = "/var/lib/internalrrd/releases"
# Maximum artifact size in bytes. Defaults to 512 MiB.
max_artifact_bytes = 536870912

# Optional environment variables passed to every instance.
[application.environment]
RUST_LOG = "info"
NTP_LISTEN_ADDR = "{listen_address:ntp}"
DNS_LISTEN_ADDR = "{listen_address:dns}"
HTTP_LISTEN_ADDR = "{listen_address:http}"
HTTPS_LISTEN_ADDR = "{listen_address:https}"

# Named private ports. Each instance receives one private port per entry.
# The declared protocols are the transports that may reach the port through the proxy.
[[application.ports]]
name = "ntp"
protocols = ["udp"]

# A single private port can serve both UDP and TCP, which is required for DNS.
[[application.ports]]
name = "dns"
protocols = ["udp", "tcp"]

[[application.ports]]
name = "http"
protocols = ["tcp"]

[[application.ports]]
name = "https"
protocols = ["tcp"]

[trust]
# Release signing keys. Ed25519 public keys are 64 hexadecimal characters.
keys = [
  { id = "release-2026", algorithm = 1, public_key = "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a" },
]

[proxy]
# Seconds an idle UDP client session is kept open.
udp_session_timeout_secs = 30

# Private ports assigned to application instances.
# When this table is absent, ephemeral ports are used instead.
[proxy.ports]
start = 30000
end = 31000

# Public L4 listeners. Each listener forwards to one named application port.
# TCP and UDP listeners may share a public port number.
[[proxy.listeners]]
protocol = "udp"
bind = "0.0.0.0"
port = 123
backend = "ntp"

[[proxy.listeners]]
protocol = "udp"
bind = "0.0.0.0"
port = 53
backend = "dns"

[[proxy.listeners]]
protocol = "tcp"
bind = "0.0.0.0"
port = 53
backend = "dns"

[[proxy.listeners]]
protocol = "tcp"
bind = "0.0.0.0"
port = 80
backend = "http"

[[proxy.listeners]]
protocol = "tcp"
bind = "0.0.0.0"
port = 443
backend = "https"
